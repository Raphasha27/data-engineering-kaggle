name: Data Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pandas numpy scikit-learn sqlalchemy requests pytest
      - run: pytest tests/ -v --tb=short -x
        env:
          PYTHONPATH: ${{ github.workspace }}

  notebooks:
    name: Notebook Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pandas numpy scikit-learn jupyter nbconvert
      - name: Check notebook outputs
        run: |
          for nb in $(find . -name "*.ipynb" -maxdepth 3); do
            echo "Checking: $nb"
            jupyter nbconvert --to script --stdout "$nb" | python -m py_compile || true
          done

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target base -t data-engineering-kaggle .
      - run: docker build --target test -t data-engineering-kaggle-test .
