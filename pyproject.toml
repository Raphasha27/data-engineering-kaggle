[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-engineering-kaggle"
version = "2.0.0"
description = "Enterprise-grade data engineering pipelines and Kaggle solutions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Raphasha27"}]
keywords = ["data-engineering", "etl", "spark", "kaggle", "pipeline"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pre-commit>=3.0",
]
spark = ["pyspark>=3.5"]
db = ["psycopg2-binary>=2.9"]
all = ["data-engineering-kaggle[dev,spark,db]"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["src*"]
